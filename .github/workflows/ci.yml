name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Ek hi branch par tez-tez push karne par purane runs cancel ho jaayenge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GitHub ke runners UTC par chalte hain, jabki prayer-time logic local time
# maanta hai. Bina TZ ke Fajr raat 23:49 nikalta hai aur 9 widget tests gir
# jaate hain jo laptop par pass hote hain.
env:
  TZ: Asia/Kolkata

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Process-level TZ Dart/Dart packages ke liye kaafi nahi hota - OS clock
      # bhi IST par honi chahiye.
      - name: Set runner timezone
        run: sudo timedatectl set-timezone Asia/Kolkata

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noor-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
