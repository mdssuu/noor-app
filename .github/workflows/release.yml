name: Release APK

# Har push par release APK banta hai, aur har push par GitHub ka "Latest APK
# (master)" release bhi update hota hai. Isse phone par hamesha latest APK
# milti hai - bina kisi tag ka intezaar kiye.
#
#   - master push  -> rolling release: releases/tag/latest  (APK hamesha latest)
#   - tag "v1.5.2" -> us version ka official release + release notes
#   - manual run   -> sirf Actions artifact
on:
  push:
    branches: [ master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # Master push me purana build cancel ho jata hai (minutes bachte hain).
  # Tag release kabhi cancel nahi hota - woh ek official release hai.
  cancel-in-progress: ${{ github.ref == 'refs/heads/master' }}

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Shorebird (over-the-air patches) is opt-in: jab tak repo me
    # SHOREBIRD_TOKEN secret nahi hai, yeh bilkul wahi `flutter build apk`
    # chalta hai jo aaj chal raha hai. Secret daalte hi har master push ek
    # Shorebird release ban jaata hai — jo APK usse banti hai wo phone par
    # bina naya APK download kiye update ho sakti hai (`shorebird patch`).
    env:
      HAS_SHOREBIRD: ${{ secrets.SHOREBIRD_TOKEN != '' }}
    steps:
      # Runner image me ~50 GB preinstalled tools hote hain (dotnet, ghc, swift,
      # NDK...) jo is build ke kaam ke nahi hain. Bina free kiye Flutter ka
      # Gradle build "No space left on device" par mar jaata hai - yahi wajah
      # hai ki pehle APK kabhi bante hi nahi the.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/local/share/vcpkg \
            /usr/local/share/miniconda \
            /usr/local/.ghcup \
            /opt/ghc \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/julia* \
            /usr/local/lib/android/sdk/ndk* \
            /usr/local/lib/android/sdk/cmake \
            /usr/local/lib/android/sdk/extras \
            /usr/local/lib/android/sdk/sources
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      # Secret files repo me nahi hain (signing key + Firebase config). Agar ye
      # repo me hoti to koi bhi aapki tarah signed APK bana sakta tha. Yahan
      # GitHub Actions ke secrets se wapas likhi jaati hain - sirf is workflow
      # ke andar, aur runner khatam hote hi gayab.
      - name: Reveal private build files
        env:
          NOOR_KEY_PROPERTIES: ${{ secrets.NOOR_KEY_PROPERTIES }}
          NOOR_KEY_P12_B64: ${{ secrets.NOOR_KEY_P12_B64 }}
          NOOR_GMS_JSON_B64: ${{ secrets.NOOR_GMS_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${NOOR_KEY_PROPERTIES:-}" ]; then
            printf '%s\n' "$NOOR_KEY_PROPERTIES" > android/key.properties
            echo "key.properties likhi gayi"
          fi
          if [ -n "${NOOR_KEY_P12_B64:-}" ]; then
            printf '%s' "$NOOR_KEY_P12_B64" | base64 -d > android/app/noor-release.p12
            echo "noor-release.p12 likhi gayi"
          fi
          if [ -n "${NOOR_GMS_JSON_B64:-}" ]; then
            printf '%s' "$NOOR_GMS_JSON_B64" | base64 -d > android/app/google-services.json
            echo "google-services.json likhi gayi"
          fi

      # Key na ho to build chup-chaap debug key par sign kar deti hai, aur
      # phone par purani APK ke upar install hi nahi hoti. Abhi rok do.
      - name: Release key maujood hai?
        run: |
          if [ ! -f android/key.properties ] || [ ! -f android/app/noor-release.p12 ]; then
            echo "::error::Signing key nahi mili. Repo secrets NOOR_KEY_PROPERTIES aur NOOR_KEY_P12_B64 set karo (README me tarika hai)."
            exit 1
          fi
          if [ ! -f android/app/google-services.json ]; then
            echo "::error::google-services.json nahi mili - secret NOOR_GMS_JSON_B64 set karo."
            exit 1
          fi
          ls -l android/key.properties android/app/noor-release.p12 android/app/google-services.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Shorebird apna Flutter laata hai (isi liye isko Flutter step ke baad
      # lagaya gaya hai — dono ka version wahi hai, jo shorebird.yaml app_id
      # se juda hua hai). Jab tak token nahi hai yeh step chhoot jaata hai.
      - name: Setup Shorebird
        if: env.HAS_SHOREBIRD == 'true'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Patch flutter_inappwebview_android (AGP 8+ compatibility)
      - name: Patch flutter_inappwebview_android
        run: |
          FILE="$HOME/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle"
          if [ -f $FILE ] || ls $FILE 2>/dev/null; then
            sed -i "s|getDefaultProguardFile('proguard-android.txt')|getDefaultProguardFile('proguard-android-optimize.txt')|g" $FILE 2>/dev/null || true
            sed -i 's|getDefaultProguardFile("proguard-android.txt")|getDefaultProguardFile("proguard-android-optimize.txt")|g' $FILE 2>/dev/null || true
            echo "Patched inappwebview_android"
          else
            echo "inappwebview_android build.gradle not found in cache"
          fi

      # Runner par RAM ~8 GB hai. R8 (release build ka minifier) heap ke saath
      # chalta hai, is liye 3 GB de rahe hain - zyada nahi, warna OOM ho jata hai.
      - name: Cap Gradle memory
        run: |
          sed -i 's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m/' android/gradle.properties
          echo "org.gradle.workers.max=2" >> android/gradle.properties
          cat android/gradle.properties

      # Sirf wahi ABIs jo asli phone use karte hain (arm + arm64). x86_64
      # emulator ke liye hai - use chhodne se native libs aadhi se bhi kam
      # hoti hain aur build disk par fail hona nahi chahiye.
      #
      # Shorebird wale raaste par `shorebird release android` wahi gradle
      # build chalata hai, bas uske saath updater bhi andar chala jaata hai.
      # Ek release version dobara upload nahi hota (CLI seedha "Please bump
      # your version number" bolta hai), aur har push ka version same rehta
      # hai - isliye versionCode yahan CI ka run number hai. Isi wajah se har
      # rolling APK apne aap patch ke layak banti jaati hai, bina pubspec
      # har push par haath se badlaye.
      - name: Build release APK
        env:
          # Sirf yehi step shorebird ko token deta hai — baaki saare actions
          # (checkout, java, flutter) ko key kabhi nahi dikhti.
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$HAS_SHOREBIRD" = "true" ]; then
            echo "Shorebird release: versionCode=${{ github.run_number }}"
            shorebird release android \
              --artifact apk \
              --target-platform android-arm,android-arm64 \
              --build-number "${{ github.run_number }}"
          else
            echo "SHOREBIRD_TOKEN nahi hai - plain flutter build (jaise pehle)"
            flutter build apk --release --target-platform android-arm,android-arm64
          fi

      - name: Name the APK and check its signature
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version:' pubspec.yaml | cut -d' ' -f2)
          # `flutter build apk` dono jagah likhta hai; shorebird ka build
          # sirf apk/release/ par chhod sakta hai. Dono me se jo mile wahi
          # aage ka source hai.
          APK=""
          for CAND in build/app/outputs/flutter-apk/app-release.apk build/app/outputs/apk/release/app-release.apk; do
            if [ -f "$CAND" ]; then APK="$CAND"; break; fi
          done
          if [ -z "$APK" ]; then
            echo "::error::APK nahi bani - flutter-apk/ aur apk/release/ dono khaali"
            ls -R build/app/outputs || true
            exit 1
          fi
          OUT=build/app/outputs/flutter-apk
          mkdir -p "$OUT"
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            cp "$APK" "$OUT/noor-masjid-time-latest.apk"
          else
            cp "$APK" "$OUT/noor-masjid-time-${VERSION}.apk"
          fi
          # Neeche wale upload steps hamesha flutter-apk/ se padhte hain, so
          # shorebird ke raaste par bhi wahi naam wahin rakha jaata hai.
          if [ "$APK" != "$OUT/app-release.apk" ]; then
            cp "$APK" "$OUT/app-release.apk"
          fi
          ls -lh "$OUT/"
          # Agar galat key se sign ho gayi to nayi APK purani ke upar install
          # nahi hoti - abhi pakad lo, phone par pata chalne se behtar hai.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | head -20 || true
          else
            echo "apksigner nahi mila - signature check skip"
          fi

      # Tag push par: us version ka official release (release notes auto).
      - name: Attach APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/noor-masjid-time-*.apk
          generate_release_notes: true

      # Master push par: rolling release. Iska matlab - Releases page par hamesha
      # latest APK maujood, aur uska link kabhi nahi badalta:
      #   https://github.com/mdssuu/noor-app/releases/download/latest/noor-masjid-time-latest.apk
      #
      # Ye release prerelease NAHI hai, aur wajah ye hai: GitHub prerelease ko
      # "Latest" maanna band kar deta hai - /releases/latest inkaar kar deta
      # hai aur Releases page par use ek alag tab me dhakka deta hai, jahan ek
      # aam user kabhi nahi jaata. Matlab har push ke baad APK technically
      # maujood hota hai par kisi ko dikhta nahi. `make_latest: true` ise
      # repository ka latest release banaye rakhta hai.
      - name: Update the rolling "Latest APK" release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK (master)
          prerelease: false
          make_latest: true
          files: build/app/outputs/flutter-apk/noor-masjid-time-latest.apk
          body: |
            Har `master` push par ye release update hoti hai.

            **Download:** [noor-masjid-time-latest.apk](https://github.com/mdssuu/noor-app/releases/download/latest/noor-masjid-time-latest.apk)

            Version: `${{ github.sha }}` se build hua hai
            (commit: https://github.com/mdssuu/noor-app/commit/${{ github.sha }}).

      # Purana "noor-apk me publish" step hata diya gaya: naam ki repo
      # (mdssuu/noor-apk) exist hi nahi karti, har run wahan 404 par chup-chaap
      # fail hoti thi, aur About screen ka link bhi wahi tha. Ab sirf ek hi
      # jagah APK jaati hai - yahi repo (noor-app) ki rolling release.

      # Manual run (bina tag ke) par: artifact ke roop me rakho.
      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: noor-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Diagnose a failed build
        if: failure()
        run: |
          echo "=== DISK ==="
          df -h /
          echo ""
          echo "=== SABSE BADE FOLDERS (space kahan gaya?) ==="
          sudo du -sh /usr/share /usr/local /opt /home/runner 2>/dev/null | sort -h
          echo ""
          echo "=== build/ ==="
          du -sh build 2>/dev/null || true
          echo ""
          echo "=== APK mili ya nahi ==="
          ls -lh build/app/outputs/flutter-apk/ 2>/dev/null || true
